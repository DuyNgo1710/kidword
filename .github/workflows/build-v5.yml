name: Build WordPop Kids v5 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'WordPopKidsV5Android.zip'
      - '.github/workflows/build-v5.yml'
  workflow_dispatch:

jobs:
  build-v5-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip WordPop Kids v5 project
        run: unzip -o WordPopKidsV5Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v5 Debug APK
        working-directory: WordPopKidsV5Android
        run: gradle assembleDebug --stacktrace

      - name: Upload v5 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-Kids-v5-APK
          path: WordPopKidsV5Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
