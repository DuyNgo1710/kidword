name: Build WordPop Kids v3 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'WordPopKidsV3Android.zip'
      - '.github/workflows/build-v3.yml'
  workflow_dispatch:

jobs:
  build-v3-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip WordPop Kids v3 project
        run: unzip -o WordPopKidsV3Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v3 Debug APK
        working-directory: WordPopKidsV3Android
        run: gradle assembleDebug --stacktrace

      - name: Upload v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-Kids-v3-APK
          path: WordPopKidsV3Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
