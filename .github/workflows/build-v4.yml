name: Build WordPop Kids v4 APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'WordPopKidsV4Android.zip'
      - '.github/workflows/build-v4.yml'
  workflow_dispatch:

jobs:
  build-v4-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip WordPop Kids v4 project
        run: unzip -o WordPopKidsV4Android.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v4 Debug APK
        working-directory: WordPopKidsV4Android
        run: gradle assembleDebug --stacktrace

      - name: Upload v4 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordPop-Kids-v4-APK
          path: WordPopKidsV4Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
